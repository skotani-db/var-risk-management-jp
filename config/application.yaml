yfinance:
  # ダミーデータの期間（yfinanceは使用しないが、データ生成の範囲として利用）
  mindate: '2024-05-01'
  maxdate: '2026-05-01'

model:
  # Unity Catalogに登録されるモデルの名前（catalog.schema.model_name 形式で自動構成）
  name: 'value_at_risk'
  # モデルを訓練する日付（データ期間の終了日より前）
  date: '2026-04-01'

database:
  # Unity Catalog の3レベル名前空間（catalog.schema.table）
  # ご自身の環境に合わせて catalog 名を変更してください
  catalog: 'shotkotani_demo_ws'
  schema: 'var_risk_demo'
  # Volume名（CSVアップロード先）
  volume: 'raw_data'
  tables:
    stocks: 'market_data'
    indicators: 'market_indicators'
    volatility: 'market_volatility'
    mc_market: 'monte_carlo_market'
    mc_trials: 'monte_carlo_trials'
    # Auto Loader チェックポイント用
    stocks_checkpoint: '_checkpoints/stocks'
    indicators_checkpoint: '_checkpoints/indicators'
    # データ品質テーブル
    stocks_quarantine: 'market_data_quarantine'
    indicators_quarantine: 'market_indicators_quarantine'

monte-carlo:
  # 利用可能なノード数の制御
  executors: 20
  # 過去のボラティリティ計算に使用する履歴期間（日数）
  volatility: 90
  # 各銘柄のシミュレーション回数
  runs: 2000
